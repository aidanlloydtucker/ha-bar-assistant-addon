location = /ha-autologin {
    limit_except POST {
        deny all;
    }

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/ha-autologin/token.php;
    fastcgi_pass 127.0.0.1:9000;
}

# Salt Rim's SSO callback exchanges the code for a token. The code already is
# the token from /ha-autologin, so hand it back.
location = /bar/api/auth/sso/homeassistant/callback {
    default_type application/json;

    if ($arg_code ~* "^([0-9]+)(?:%7C|\|)([A-Za-z0-9]+)$") {
        return 200 '{"data":{"token":"$1|$2"}}';
    }

    return 400 '{"message":"Invalid auto-login code."}';
}
